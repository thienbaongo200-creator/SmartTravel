{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    /* Cấu trúc nền phủ toàn màn hình */
    .error-page-section {
        background: linear-gradient(rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.7)), 
                    url('https://images.unsplash.com/photo-1488646953014-85cb44e25828?q=80&w=1935&auto=format&fit=crop'); 
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        min-height: 90vh;
        display: flex;
        align-items: center; /* Căn giữa theo chiều dọc */
        justify-content: center; /* Căn giữa theo chiều ngang */
        font-family: 'Segoe UI', Roboto, sans-serif;
    }

    /* Card chứa nội dung */
    .custom-card {
        background: rgba(255, 255, 255, 0.98);
        padding: 60px 40px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        max-width: 600px;
        width: 90%;
        border-top: 10px solid #3498db;
        /* Đảm bảo nội dung bên trong card luôn ở giữa */
        display: flex;
        flex-direction: column;
        align-items: center; 
        text-align: center;
    }

    /* Loại bỏ gạch chân cho tất cả liên kết */
    .custom-card a {
        text-decoration: none !important;
    }

    /* Mã lỗi 404 */
    .code-text-404 {
        font-size: clamp(80px, 15vw, 120px); /* Tự động co giãn kích thước chữ */
        font-weight: 900;
        line-height: 1;
        background: -webkit-linear-gradient(#3498db, #2980b9);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 20px;
        font-family: 'Arial Black', sans-serif;
    }

    /* Hiệu ứng la bàn tìm hướng */
    .icon-404 {
        font-size: 70px;
        color: #f39c12;
        margin-bottom: 20px;
        filter: drop-shadow(0 5px 15px rgba(243, 156, 18, 0.3));
    }

    .fa-compass {
        animation: findDirection 6s ease-in-out infinite;
    }

    @keyframes findDirection {
        0% { transform: rotate(0deg); }
        20% { transform: rotate(25deg); }
        40% { transform: rotate(-15deg); }
        60% { transform: rotate(30deg); }
        80% { transform: rotate(-5deg); }
        100% { transform: rotate(0deg); }
    }

    /* Tùy chỉnh nút bấm */
    .btn-sync {
        padding: 15px 35px;
        border-radius: 50px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.3s ease;
        background-color: #3498db;
        color: white !important;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        margin-top: 20px;
    }

    .btn-sync:hover {
        background-color: #2980b9;
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(52, 152, 219, 0.3);
    }
</style>

<div class="error-page-section">
    <div class="custom-card">
        <div class="icon-404">
            <i class="fas fa-compass"></i>
        </div>

        <span class="code-text-404">404</span>

        <h2 class="mb-3 text-dark font-weight-bold">BẠN ĐÃ LẠC ĐƯỜNG?</h2>
        <p class="text-muted">
            Trang bạn đang tìm kiếm không tồn tại trên bản đồ du lịch.<br>
            Hãy để chúng tôi dẫn đường cho bạn quay lại.
        </p>

        <a href="{% url 'home' %}" class="btn btn-sync shadow-sm">
            <i class="fas fa-home me-2"></i> Quay về trang chủ
        </a>
    </div>
</div>
{% endblock %}
