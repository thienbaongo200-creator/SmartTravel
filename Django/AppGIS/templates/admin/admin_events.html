{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sự kiện | Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
    
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .glass-card { background: white; border-radius: 15px; border: none; padding: 1.5rem; shadow: 0 4px 12px rgba(0,0,0,0.05); }
        .required-label::after { content: " *"; color: #dc3545; }
        .preview-img { width: 80px; height: 55px; object-fit: cover; border-radius: 6px; border: 1px solid #dee2e6; }
        .status-badge { font-size: 0.75rem; padding: 5px 12px; border-radius: 20px; font-weight: 600; }
        /* Style cho CKEditor 5 để không bị quá cao */
        .ck-editor__editable { min-height: 200px; }
        .sidebar-link.active { background: rgba(255,255,255,0.1); border-left: 4px solid #fff; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-brand">
        <i class="fas fa-map-marked-alt"></i>
        <span>Smart Travel</span>
    </div>
    <nav>
        <a href="{% url 'admin_dashboard' %}" class="sidebar-link"><i class="fas fa-th-large"></i> Dashboard</a>
        <a href="{% url 'admin_places' %}" class="sidebar-link"><i class="fas fa-layer-group"></i> Quản lý Địa điểm</a>
        <a href="{% url 'admin_manage_events' %}" class="sidebar-link active"><i class="fas fa-calendar-alt"></i> Quản lý Sự kiện</a>
        <hr style="border-top: 1px solid rgba(255,255,255,0.1);">
        <a href="{% url 'logout' %}" class="sidebar-link" style="color: #ff7675;"><i class="fas fa-sign-out-alt"></i> Đăng xuất</a>
    </nav>
</div>

<main class="main-content">
    <div class="header-section mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h2 class="fw-bold">Quản lý Sự kiện</h2>
            <p class="text-muted small">Cập nhật các hoạt động văn hóa và lễ hội du lịch.</p>
        </div>
        <span class="badge bg-white text-primary p-3 shadow-sm rounded-4 text-dark">
            <i class="fas fa-calendar-day me-2 text-primary"></i>{% now "d/m/Y" %}
        </span>
    </div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="glass-card sticky-top" style="top: 20px;">
                <h5 class="fw-bold mb-4 text-primary" id="formTitle">
                    <i class="fas fa-plus-circle me-2"></i>Thêm sự kiện mới
                </h5>
                <form id="eventForm" enctype="multipart/form-data">
                    {% csrf_token %}
                    <input type="hidden" id="eventId">

                    <div class="mb-3">
                        <label class="small fw-bold text-muted mb-2 required-label">TIÊU ĐỀ</label>
                        <input type="text" name="title" id="title" class="form-control" placeholder="Tên lễ hội, sự kiện..." required>
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="small fw-bold text-muted mb-2">THỂ LOẠI</label>
                            <select name="category" id="category" class="form-select">
                                <option value="Văn hóa">Văn hóa</option>
                                <option value="Lễ hội">Lễ hội</option>
                                <option value="Âm nhạc">Âm nhạc</option>
                                <option value="Ẩm thực">Ẩm thực</option>
                            </select>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="small fw-bold text-muted mb-2">TRẠNG THÁI</label>
                            <select name="status_type" id="status_type" class="form-select">
                                <option value="Sắp diễn ra">Sắp diễn ra</option>
                                <option value="Đang diễn ra">Đang diễn ra</option>
                                <option value="Đã kết thúc">Đã kết thúc</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="small fw-bold text-muted mb-2">ĐỊA ĐIỂM</label>
                        <input type="text" name="location" id="location" class="form-control" placeholder="Địa chỉ tổ chức">
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="small fw-bold text-muted mb-2 required-label">NGÀY BẮT ĐẦU</label>
                            <input type="date" name="start_date" id="start_date" class="form-control" required>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="small fw-bold text-muted mb-2">NGÀY KẾT THÚC</label>
                            <input type="date" name="end_date" id="end_date" class="form-control">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="small fw-bold text-muted mb-2">MÔ TẢ CHI TIẾT</label>
                        <div id="editor"></div> </div>

                    <div class="mb-3">
                        <label class="small fw-bold text-muted mb-2">HÌNH ẢNH</label>
                        <input type="file" name="images" class="form-control" id="inputImages" accept="image/*" multiple>
                        <div id="imagePreview" class="d-flex gap-2 mt-2 flex-wrap"></div>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm" id="btnSubmit">
                            <i class="fas fa-save me-2"></i>Lưu dữ liệu
                        </button>
                        <button type="button" class="btn btn-light w-100 border mt-2" id="btnCancel" style="display:none;" onclick="resetForm()">
                            Hủy bỏ
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="glass-card">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="fw-bold mb-0">Danh sách Sự kiện</h5>
                    <span class="badge bg-primary rounded-pill px-3" id="eventCount">0</span>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 40%;">Sự kiện</th>
                                <th>Thể loại</th>
                                <th>Thời gian</th>
                                <th class="text-end">Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="eventTableBody">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.ckeditor.com/ckeditor5/35.4.0/classic/ckeditor.js"></script>

<script>
    let allEvents = [];
    let eventEditor;

    // Khởi tạo CKEditor 5
    ClassicEditor
        .create(document.querySelector('#editor'))
        .then(editor => { eventEditor = editor; })
        .catch(error => { console.error(error); });

    // Load dữ liệu
    async function loadEvents() {
        try {
            const res = await fetch('/api/events/');
            allEvents = await res.json();
            document.getElementById('eventCount').innerText = allEvents.length;
            const tbody = document.getElementById('eventTableBody');
            
            tbody.innerHTML = allEvents.map(ev => `
                <tr>
                    <td>
                        <div class="d-flex align-items-center">
                            <img src="${(ev.images && ev.images.length > 0) ? ev.images[0] : 'https://via.placeholder.com/80x55'}" class="preview-img me-3">
                            <div>
                                <div class="fw-bold text-dark">${ev.title}</div>
                                <small class="text-muted"><i class="fas fa-map-marker-alt me-1"></i>${ev.location || 'N/A'}</small>
                            </div>
                        </div>
                    </td>
                    <td><span class="badge bg-light text-dark border">${ev.category}</span></td>
                    <td><small class="fw-bold">${ev.start_date}</small></td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-primary border-0" onclick="openEdit(${ev.id})"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-sm btn-outline-danger border-0" onclick="deleteEvent(${ev.id})"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        } catch (e) { console.error("Lỗi:", e); }
    }

    // Submit Form (Thêm/Sửa)
    document.getElementById('eventForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const id = document.getElementById('eventId').value;
        const formData = new FormData(this);
        formData.append('description', eventEditor.getData());

        const url = id ? `/api/events/${id}/` : '/api/events/';
        // Nếu là PUT (sửa), Django REST thường cần method POST + Header đặc biệt hoặc thật sự dùng PUT
        const method = id ? "PUT" : "POST"; 

        try {
            const res = await fetch(url, {
                method: method,
                body: formData,
                headers: { "X-CSRFToken": "{{ csrf_token }}" }
            });
            if (res.ok) { 
                alert("Thao tác thành công!");
                resetForm(); 
                loadEvents(); 
            }
        } catch (error) { alert("Lỗi lưu dữ liệu!"); }
    });

    // Mở mode chỉnh sửa
    function openEdit(id) {
        const ev = allEvents.find(x => x.id == id);
        if (!ev) return;
        window.scrollTo({ top: 0, behavior: 'smooth' });

        document.getElementById('eventId').value = ev.id;
        document.getElementById('title').value = ev.title;
        document.getElementById('location').value = ev.location;
        document.getElementById('start_date').value = ev.start_date;
        document.getElementById('end_date').value = ev.end_date || "";
        document.getElementById('category').value = ev.category;
        document.getElementById('status_type').value = ev.status;
        eventEditor.setData(ev.description || "");
        
        document.getElementById('formTitle').innerHTML = '<i class="fas fa-edit text-warning"></i> Chỉnh sửa sự kiện';
        document.getElementById('btnSubmit').className = "btn btn-warning w-100 fw-bold";
        document.getElementById('btnCancel').style.display = "block";
    }

    // Reset Form
    function resetForm() {
        document.getElementById('eventForm').reset();
        document.getElementById('eventId').value = "";
        eventEditor.setData("");
        document.getElementById('imagePreview').innerHTML = '';
        document.getElementById('formTitle').innerHTML = '<i class="fas fa-plus-circle text-primary"></i> Thêm sự kiện mới';
        document.getElementById('btnSubmit').className = "btn btn-primary w-100 fw-bold";
        document.getElementById('btnCancel').style.display = "none";
    }

    // Xóa
    async function deleteEvent(id) {
        if (confirm("Bạn chắc chắn muốn xóa sự kiện này?")) {
            await fetch(`/api/events/${id}/`, { 
                method: "DELETE", 
                headers: { "X-CSRFToken": "{{ csrf_token }}" } 
            });
            loadEvents();
        }
    }

    // Preview ảnh khi chọn file
    document.getElementById('inputImages').addEventListener('change', function() {
        const preview = document.getElementById('imagePreview');
        preview.innerHTML = '';
        [...this.files].forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.createElement('img');
                img.src = e.target.result;
                img.className = 'preview-img';
                preview.appendChild(img);
            };
            reader.readAsDataURL(file);
        });
    });

    window.onload = loadEvents;
</script>
</body>
</html>
