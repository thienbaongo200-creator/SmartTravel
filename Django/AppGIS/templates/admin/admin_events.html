{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sự kiện | Smart Travel Admin</title>
    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.ckeditor.com/4.22.1/standard/ckeditor.js"></script>
    <style>
        .editing-mode { border: 2px solid #ff9f43 !important; }
        .required-label::after { content: " *"; color: #ff7675; }
        .img-preview-sm { width: 60px; height: 45px; object-fit: cover; border-radius: 8px; }
        .ck-editor__editable { min-height: 200px; }
        .main-content { background-color: #f4f7fe; }
        
        /* CSS: Vùng xem trước ảnh trong Form */
        #previewContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        .preview-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #ddd;
            transition: all 0.2s ease;
        }
        .preview-wrapper:hover {
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }
        .preview-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Nút X xóa ảnh */
        .preview-remove {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 22px;
            height: 22px;
            background: #ff4757;
            color: white;
            border: 2px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.2s ease;
            z-index: 10;
        }
        .preview-remove:hover {
            background: #ee5a6f;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-map-marked-alt"></i>
            <span>Smart Travel</span>
        </div>
        <nav>
            <a href="{% url 'admin_dashboard' %}" class="sidebar-link"><i class="fas fa-th-large"></i> <span>Dashboard</span></a>
            <a href="{% url 'admin_places' %}" class="sidebar-link"><i class="fas fa-layer-group"></i> <span>Quản lý Địa điểm</span></a>
            <a href="#" class="sidebar-link active"><i class="fas fa-calendar-alt"></i> <span>Quản lý Sự kiện</span></a>
            <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 20px 0;">
            <a href="{% url 'logout' %}" class="sidebar-link" style="color: #ff7675;"><i class="fas fa-sign-out-alt"></i> <span>Đăng xuất</span></a>
        </nav>
    </div>

    <div class="main-content">
        <div class="header-section mb-4">
            <h2 class="fw-bold">Quản lý Sự kiện</h2>
            <p>Tổ chức và cập nhật các hoạt động du lịch, lễ hội nổi bật.</p>
        </div>

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="glass-card sticky-top" style="top: 20px;" id="formCard">
                    <h5 class="fw-bold mb-4" id="formTitle">
                        <i class="fas fa-magic text-primary me-2"></i>Thêm sự kiện mới
                    </h5>
                    <form id="eventForm" enctype="multipart/form-data">
                        {% csrf_token %}
                        <input type="hidden" id="eventId">

                        <div class="mb-3">
                            <label class="form-label small fw-bold required-label">TÊN SỰ KIỆN</label>
                            <input type="text" name="title" id="title" class="form-control" placeholder="Nhập tên sự kiện..." required>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-bold">THỂ LOẠI</label>
                                <select name="category" id="category" class="form-select">
                                    <option value="Văn hóa">Văn hóa</option>
                                    <option value="Lễ hội">Lễ hội</option>
                                    <option value="Âm nhạc">Âm nhạc</option>
                                    <option value="Ẩm thực">Ẩm thực</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-bold">TRẠNG THÁI</label>
                                <select name="status_type" id="status_type" class="form-select">
                                    <option value="Sắp diễn ra">Sắp diễn ra</option>
                                    <option value="Đang diễn ra">Đang diễn ra</option>
                                    <option value="Đã kết thúc">Đã kết thúc</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold">HÌNH ẢNH</label>
                            <input type="file" name="images" class="form-control" id="inputImages" accept="image/*" multiple>
                            <div id="previewContainer"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold">MÔ TẢ CHI TIẾT</label>
                            <textarea name="description" id="description"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm" id="btnSubmit">Lưu sự kiện</button>
                        <button type="button" class="btn btn-light w-100 mt-2 border" id="btnCancel" style="display:none;" onclick="resetForm()">Hủy bỏ</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="table-section shadow-sm p-3 bg-white rounded">
                    <h5 class="fw-bold mb-3">Danh sách sự kiện <span class="badge bg-primary" id="eventCount">0</span></h5>
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th>Sự kiện</th>
                                    <th>Thể loại</th>
                                    <th>Thời gian</th>
                                    <th class="text-center">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="eventTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        let allEvents = [];
        let eventEditor;
        let selectedFiles = []; // Lưu trữ danh sách file đã chọn
        let isEditMode = false; // Cờ để biết đang ở chế độ chỉnh sửa

        // Khởi tạo CKEditor
        CKEDITOR.replace('description');
        eventEditor = CKEDITOR.instances.description;

        // --- XỬ LÝ PREVIEW ẢNH VỚI NÚT XÓA ---
        document.getElementById('inputImages').addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            selectedFiles = files; // Lưu lại danh sách file
            updatePreview();
        });

        function updatePreview() {
            const container = document.getElementById('previewContainer');
            container.innerHTML = '';

            selectedFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const div = document.createElement('div');
                    div.className = 'preview-wrapper shadow-sm';
                    div.innerHTML = `
                        <img src="${e.target.result}" alt="Preview">
                        <div class="preview-remove" onclick="removeImage(${index})" title="Xóa ảnh">
                            <i class="fas fa-times"></i>
                        </div>
                    `;
                    container.appendChild(div);
                }
                reader.readAsDataURL(file);
            });
        }

        // Hàm xóa ảnh khỏi danh sách
        function removeImage(index) {
            selectedFiles.splice(index, 1); // Xóa file tại vị trí index
            updatePreview(); // Cập nhật lại preview
            
            // Cập nhật lại input file
            const dt = new DataTransfer();
            selectedFiles.forEach(file => dt.items.add(file));
            document.getElementById('inputImages').files = dt.files;
        }

        // Load dữ liệu
        async function loadEvents() {
            try {
                const res = await fetch('/api/events/');
                allEvents = await res.json();
                const tbody = document.getElementById('eventTableBody');
                document.getElementById('eventCount').innerText = allEvents.length;

                tbody.innerHTML = allEvents.map(ev => `
                    <tr>
                        <td>
                            <div class="d-flex align-items-center">
                                <img src="${(ev.images && ev.images.length > 0) ? ev.images[0] : 'https://via.placeholder.com/80'}" class="img-preview-sm me-3">
                                <div>
                                    <div class="fw-bold">${ev.title}</div>
                                    <div class="small text-muted">${ev.location || 'N/A'}</div>
                                </div>
                            </div>
                        </td>
                        <td><span class="badge bg-light text-dark border">${ev.category}</span></td>
                        <td class="small">${ev.start_date || 'N/A'}</td>
                        <td class="text-center">
                            <button class="btn btn-sm btn-outline-primary me-1" onclick="openEdit(${ev.id})"><i class="fas fa-pen"></i></button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteEvent(${ev.id})"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) { console.error("Lỗi tải danh sách:", e); }
        }

        // --- GỬI FORM (ĐÃ SỬA LỖI CẬP NHẬT) ---
        document.getElementById('eventForm').onsubmit = async function(e) {
            e.preventDefault();
            const id = document.getElementById('eventId').value;
            const formData = new FormData();
            
            // Thêm các trường dữ liệu
            formData.append('title', document.getElementById('title').value);
            formData.append('category', document.getElementById('category').value);
            formData.append('status_type', document.getElementById('status_type').value);
            formData.append('description', eventEditor.getData());
            
            // CHỈ THÊM ẢNH MỚI KHI NGƯỜI DÙNG CHỌN
            if (selectedFiles.length > 0) {
                selectedFiles.forEach(file => {
                    formData.append('images', file);
                });
            }

            let url, method;
            
            if (id) {
                // Chế độ cập nhật - sử dụng PATCH
                url = `/api/events/${id}/`;
                method = "PATCH";
            } else {
                // Chế độ tạo mới - sử dụng POST
                url = '/api/events/';
                method = "POST";
            }

            try {
                const res = await fetch(url, { 
                    method: method, 
                    body: formData, 
                    headers: { 
                        "X-CSRFToken": "{{ csrf_token }}"
                    } 
                });

                if (res.ok) {
                    alert(id ? "Cập nhật thành công!" : "Thêm thành công!");
                    resetForm();
                    loadEvents();
                } else {
                    const errData = await res.json();
                    console.error("Chi tiết lỗi:", errData);
                    alert("Lỗi: " + JSON.stringify(errData));
                }
            } catch (error) { 
                console.error("Lỗi:", error);
                alert("Lỗi kết nối server!"); 
            }
        };

        function openEdit(id) {
            const ev = allEvents.find(x => x.id == id);
            if (!ev) return;

            isEditMode = true;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            document.getElementById('eventId').value = ev.id;
            document.getElementById('title').value = ev.title || '';
            document.getElementById('category').value = ev.category || 'Văn hóa';
            document.getElementById('status_type').value = ev.status_type || 'Sắp diễn ra';
            eventEditor.setData(ev.description || "");

            // Reset selectedFiles khi edit (không hiển thị ảnh cũ trong preview)
            selectedFiles = [];
            document.getElementById('previewContainer').innerHTML = "";
            document.getElementById('inputImages').value = ""; // Reset input file

            document.getElementById('formCard').classList.add('editing-mode');
            document.getElementById('formTitle').innerHTML = '<i class="fas fa-edit text-warning me-2"></i>Chỉnh sửa sự kiện';
            document.getElementById('btnSubmit').innerText = "Cập nhật thay đổi";
            document.getElementById('btnCancel').style.display = "block";
        }

        function resetForm() {
            isEditMode = false;
            document.getElementById('eventForm').reset();
            document.getElementById('eventId').value = "";
            selectedFiles = []; // Reset danh sách file
            document.getElementById('previewContainer').innerHTML = "";
            document.getElementById('inputImages').value = ""; // Reset input file
            eventEditor.setData("");
            
            document.getElementById('formCard').classList.remove('editing-mode');
            document.getElementById('formTitle').innerHTML = '<i class="fas fa-magic text-primary me-2"></i>Thêm sự kiện mới';
            document.getElementById('btnSubmit').innerText = "Lưu sự kiện";
            document.getElementById('btnCancel').style.display = "none";
        }

        async function deleteEvent(id) {
            if (!confirm('Bạn có chắc muốn xóa sự kiện này?')) return;
            
            try {
                const res = await fetch(`/api/events/${id}/`, {
                    method: 'DELETE',
                    headers: { "X-CSRFToken": "{{ csrf_token }}" }
                });
                
                if (res.ok) {
                    alert('Xóa thành công!');
                    loadEvents();
                } else {
                    alert('Xóa thất bại!');
                }
            } catch (e) {
                console.error('Lỗi xóa:', e);
                alert('Lỗi khi xóa sự kiện!');
            }
        }

        window.onload = loadEvents;
    </script>
</body>
</html>
