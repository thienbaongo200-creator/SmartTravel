{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin - Quản lý Địa điểm Du lịch</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>    
    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
    <style>
        .thumb-container { display: flex; gap: 5px; flex-wrap: wrap; }
        .thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; border: 1px solid #ddd; }
        .preview-img { width: 80px; height: 80px; object-fit: cover; margin: 5px; border-radius: 5px; border: 2px solid #3498db; }
        .price-tag { color: #e74c3c; font-weight: bold; }
        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 80%; max-width: 800px; max-height: 90vh; overflow-y: auto; }
    </style>
</head>
<body>
<div class="container">
    <header><h1>Quản lý Địa điểm Du lịch</h1></header>

    <div class="back-action">
        <a href="{% url 'admin_dashboard' %}" class="btn-back">⬅ Quay lại Dashboard</a>
    </div>
    
    <nav class="tabs">
        <button onclick="loadPlaces()">Tất cả</button>
        <button onclick="loadPlaces('Khu vui chơi')">Khu vui chơi</button>
        <button onclick="loadPlaces('Nhà hàng')">Nhà hàng</button>
        <button onclick="loadPlaces('Di tích')">Di tích</button>
    </nav>

    <section class="form-card">
        <h2>➕ Thêm địa điểm mới</h2>
        <div class="admin-grid">
            <form id="addForm" class="form-side" enctype="multipart/form-data">
                <input type="text" name="name" placeholder="Tên địa điểm" required>
                <input type="text" name="category" placeholder="Loại (VD: Khách sạn)" required>
                <div class="flex-row">
                    <input type="text" id="address" name="address" placeholder="Nhập địa chỉ">
                    <button type="button" onclick="searchAddress('address','latitude','longitude', mainMap, 'mainMarker')">🔍</button>
                </div>
                <div class="flex-row">
                    <input type="number" step="any" id="latitude" name="latitude" placeholder="Vĩ độ" required>
                    <input type="number" step="any" id="longitude" name="longitude" placeholder="Kinh độ" required>
                </div>
                
                <div class="image-upload-section">
                    <label>📷 Ảnh chính (đại diện):</label>
                    <input type="file" name="main_image" accept="image/*" required>
                </div>

                <div class="image-upload-section">
                    <label>🖼️ Ảnh phụ (Gallery - Tối đa 6):</label>
                    <input type="file" id="image_files" name="images" accept="image/*" multiple>
                    <div id="image_preview" class="thumb-container"></div>
                </div>

                <input type="number" name="price" placeholder="Giá tiền (VNĐ)">
                <button type="submit" class="btn btn-add">Thêm mới</button>
            </form>

            <div class="map-side">
                <div id="map" style="height:450px; border-radius: 8px;"></div>
            </div>
        </div>
    </section>

    <section class="table-section">
        <h2>📋 Danh sách địa điểm</h2>
        <table>
            <thead>
                <tr>
                    <th>Ảnh chính</th>
                    <th>Gallery</th>
                    <th>Thông tin</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="placesTable"></tbody>
        </table>
    </section>
</div>

<div id="editModal" class="modal">
  <div class="modal-content">
    <h3>Sửa địa điểm</h3>
    <form id="editForm" enctype="multipart/form-data">
      <input type="hidden" id="editId">
      <div class="admin-grid">
          <div class="form-side">
              <input type="text" id="editName" name="name" placeholder="Tên" required class="full-width">
              <input type="text" id="editCategory" name="category" placeholder="Loại" required class="full-width">
              <div class="flex-row">
                <input type="text" id="editAddress" name="address" placeholder="Sửa địa chỉ" class="full-width">
                <button type="button" onclick="searchAddress('editAddress','editLat','editLng', editMap, 'editMarker')">🔍</button>
              </div>
              <div class="flex-row">
                <input type="number" step="any" id="editLat" name="latitude" required>
                <input type="number" step="any" id="editLng" name="longitude" required>
              </div>
              <input type="number" id="editPrice" name="price" placeholder="Giá tiền (VNĐ)" class="full-width">
              
              <label>Thay ảnh chính:</label>
              <input type="file" name="main_image" accept="image/*">
              
              <label>Thêm ảnh phụ mới:</label>
              <input type="file" id="edit_image_files" name="images" accept="image/*" multiple>
              <div id="edit_image_preview" class="thumb-container"></div>
          </div>
          <div class="map-side">
              <div id="editMap" style="height:300px; margin-bottom:10px;"></div>
          </div>
      </div>
      
      <div class="modal-actions" style="text-align:right;">
        <button type="submit" class="btn btn-edit">💾 Lưu thay đổi</button>
        <button type="button" class="btn btn-delete" onclick="closeEditModal()">✖ Đóng</button>
      </div>
    </form>
  </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
let mainMap, mainMarker, editMap, editMarker, markers = [];

// Khởi tạo Map
function initMainMap() {
    mainMap = L.map('map').setView([10.776, 106.700], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(mainMap);
    mainMarker = L.marker([10.776, 106.700], {draggable: true}).addTo(mainMap);
    
    mainMap.on('click', e => {
        mainMarker.setLatLng(e.latlng);
        updateCoords('latitude', 'longitude', e.latlng);
    });
    mainMarker.on('dragend', () => updateCoords('latitude', 'longitude', mainMarker.getLatLng()));
}

function updateCoords(latId, lngId, latlng) {
    document.getElementById(latId).value = latlng.lat.toFixed(6);
    document.getElementById(lngId).value = latlng.lng.toFixed(6);
}

// Load & Render
async function loadPlaces(filter = null) {
    const res = await fetch("/api/admin/places/");
    const data = await res.json();
    renderData(data, filter);
}

function renderData(data, filter) {
    const tbody = document.getElementById("placesTable");
    tbody.innerHTML = "";
    // Xóa marker cũ
    markers.forEach(m => mainMap.removeLayer(m));
    markers = [];

    data.filter(p => !filter || p.category === filter).forEach(p => {
        // Vẽ Marker
        const m = L.marker([p.latitude, p.longitude]).addTo(mainMap)
                   .bindPopup(`<b>${p.name}</b><br><img src="${p.img}" width="100">`);
        markers.push(m);

        // Render Table
        const galleryHtml = (p.gallery || []).map(url => `<img src="${url}" class="thumb">`).join('');
        tbody.innerHTML += `
            <tr>
                <td><img src="${p.img}" class="thumb" style="width:80px; height:60px;"></td>
                <td><div class="thumb-container">${galleryHtml}</div></td>
                <td>
                    <strong>${p.name}</strong><br><small>${p.category}</small><br>
                    <span class="price-tag">${new Intl.NumberFormat('vi-VN').format(p.price)}đ</span>
                </td>
                <td>
                    <button class="btn btn-edit" onclick='openEditModal(${JSON.stringify(p)})'>✏️</button>
                    <button class="btn btn-delete" onclick="deletePlace(${p.id})">🗑️</button>
                </td>
            </tr>`;
    });
}

// Xử lý thêm mới
document.getElementById("addForm").addEventListener("submit", async e => {
    e.preventDefault();
    const formData = new FormData(e.target);
    
    const res = await fetch("/api/admin/places/", {
        method: "POST",
        body: formData,
        headers: { "X-CSRFToken": "{{ csrf_token }}" }
    });

    if (res.ok) {
        alert("Thêm thành công!");
        e.target.reset();
        document.getElementById('image_preview').innerHTML = '';
        loadPlaces();
    }
});

// Xử lý sửa
function openEditModal(p) {
    document.getElementById('editId').value = p.id;
    document.getElementById('editName').value = p.name;
    document.getElementById('editCategory').value = p.category;
    document.getElementById('editAddress').value = p.address || '';
    document.getElementById('editLat').value = p.latitude;
    document.getElementById('editLng').value = p.longitude;
    document.getElementById('editPrice').value = p.price;

    document.getElementById('editModal').style.display = 'flex';
    
    if (!editMap) {
        editMap = L.map('editMap').setView([p.latitude, p.longitude], 15);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(editMap);
        editMarker = L.marker([p.latitude, p.longitude], {draggable: true}).addTo(editMap);
        editMarker.on('dragend', () => updateCoords('editLat', 'editLng', editMarker.getLatLng()));
    } else {
        editMap.setView([p.latitude, p.longitude], 15);
        editMarker.setLatLng([p.latitude, p.longitude]);
    }
    setTimeout(() => editMap.invalidateSize(), 200);
}

document.getElementById("editForm").addEventListener("submit", async e => {
    e.preventDefault();
    const id = document.getElementById("editId").value;
    const formData = new FormData(e.target);

    const res = await fetch(`/api/admin/places/${id}/`, {
        method: "PUT", // Hoặc POST tùy config backend
        body: formData,
        headers: { "X-CSRFToken": "{{ csrf_token }}" }
    });

    if (res.ok) {
        closeEditModal();
        loadPlaces();
        alert("Cập nhật thành công!");
    }
});

// Tiện ích preview ảnh
function setupPreview(inputId, previewId) {
    document.getElementById(inputId).addEventListener('change', function(e) {
        const container = document.getElementById(previewId);
        container.innerHTML = '';
        if (e.target.files.length > 6) { alert("Tối đa 6 ảnh!"); e.target.value = ""; return; }
        Array.from(e.target.files).forEach(file => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = document.createElement('img');
                img.src = ev.target.result;
                img.className = 'preview-img';
                container.appendChild(img);
            }
            reader.readAsDataURL(file);
        });
    });
}

async function deletePlace(id) {
    if (confirm("Xóa địa điểm này?")) {
        await fetch(`/api/admin/places/${id}/`, { 
            method: "DELETE", headers: { "X-CSRFToken": "{{ csrf_token }}" } 
        });
        loadPlaces();
    }
}

function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }
setupPreview('image_files', 'image_preview');
setupPreview('edit_image_files', 'edit_image_preview');
window.onload = () => { initMainMap(); loadPlaces(); };
</script>
</body>
</html>
