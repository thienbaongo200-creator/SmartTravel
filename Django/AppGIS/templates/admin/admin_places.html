{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin - Quản lý Địa điểm Du lịch</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>    
    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
</head>
<body>
<div class="container">
    <header><h1>Quản lý Địa điểm Du lịch</h1></header>

    <div class="back-action">
        <a href="{% url 'admin_dashboard' %}" class="btn-back">⬅ Quay lại Dashboard</a>
    </div>
    
    <nav class="tabs">
        <button onclick="loadPlaces()">Tất cả</button>
        <button onclick="loadPlaces('Khu vui chơi')">Khu vui chơi</button>
        <button onclick="loadPlaces('Nhà hàng')">Nhà hàng</button>
        <button onclick="loadPlaces('Di tích')">Di tích</button>
        <button onclick="loadPlaces('Khách sạn')">Khách sạn</button>
    </nav>

    <section class="form-card">
        <h2>➕ Thêm địa điểm mới</h2>
        <div class="admin-grid">
            <form id="addForm" class="form-side" enctype="multipart/form-data">
                <input type="text" name="name" placeholder="Tên địa điểm" required class="full-width">
                <input type="text" name="category" placeholder="Loại (VD: Khách sạn)" required class="full-width">
                <div class="flex-row">
                    <input type="text" id="address" name="address" placeholder="Nhập địa chỉ">
                    <button type="button" onclick="searchAddress('address','latitude','longitude', mainMap, 'mainMarker')">🔍</button>
                </div>
                <div class="flex-row">
                    <input type="number" step="any" id="latitude" name="latitude" placeholder="Vĩ độ" required>
                    <input type="number" step="any" id="longitude" name="longitude" placeholder="Kinh độ" required>
                </div>
                
                <div class="image-upload-section">
                    <label>📷 Ảnh chính (đại diện):</label>
                    <input type="file" name="main_image" accept="image/*" required>
                </div>

                <div class="image-upload-section">
                    <label>🖼️ Ảnh phụ (Gallery - Tối đa 6):</label>
                    <input type="file" id="image_files" name="images" accept="image/*" multiple>
                    <div id="image_preview" class="thumb-container"></div>
                </div>

                <input type="number" name="price" placeholder="Giá tiền (VNĐ)" class="full-width">
                <button type="submit" class="btn btn-add">Thêm mới</button>
            </form>

            <div class="map-side">
                <div id="map" style="height:450px; border-radius: 8px;"></div>
            </div>
        </div>
    </section>

    <section class="table-section">
        <h2>📋 Danh sách địa điểm</h2>
        <table>
            <thead>
                <tr>
                    <th>Ảnh chính</th>
                    <th>Gallery</th>
                    <th>Thông tin</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="placesTable"></tbody>
        </table>
    </section> <div id="pagination" class="pagination-container"></div>
</div>
</div>

<div id="editModal" class="modal">
  <div class="modal-content">
    <h3>Sửa địa điểm</h3>
    <form id="editForm" enctype="multipart/form-data">
      <input type="hidden" id="editId">
      <div class="admin-grid">
          <div class="form-side">
              <input type="text" id="editName" name="name" placeholder="Tên" required class="full-width">
              <input type="text" id="editCategory" name="category" placeholder="Loại" required class="full-width">
              <div class="flex-row">
                <input type="text" id="editAddress" name="address" placeholder="Sửa địa chỉ">
                <button type="button" onclick="searchAddress('editAddress','editLat','editLng', editMap, 'editMarker')">🔍</button>
              </div>
              <div class="flex-row">
                <input type="number" step="any" id="editLat" name="latitude" required>
                <input type="number" step="any" id="editLng" name="longitude" required>
              </div>
              <input type="number" id="editPrice" name="price" placeholder="Giá tiền (VNĐ)" class="full-width">
              
              <label>Thay ảnh chính:</label>
              <input type="file" name="main_image" accept="image/*">
              
              <label>Thêm ảnh phụ mới:</label>
              <input type="file" id="edit_image_files" name="images" accept="image/*" multiple>
              <div id="edit_image_preview" class="thumb-container"></div>
          </div>
          <div class="map-side">
              <div id="editMap" style="height:300px; margin-bottom:10px; border: 1px solid #ccc;"></div>
          </div>
      </div>
      
      <div class="modal-actions" style="text-align:right; margin-top: 15px;">
        <button type="submit" class="btn btn-edit">💾 Lưu thay đổi</button>
        <button type="button" class="btn btn-delete" onclick="closeEditModal()">✖ Đóng</button>
      </div>
    </form>
  </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
// --- BIẾN TOÀN CỤC ---
let mainMap, mainMarker, editMap, editMarker;
let markers = [];      // Chứa các marker trên bản đồ chính
let allData = [];      // Dữ liệu gốc từ server
let filteredData = []; // Dữ liệu sau khi lọc (dùng để phân trang)
let currentPage = 1;   
const itemsPerPage = 10;

// --- 1. KHỞI TẠO & LOAD DỮ LIỆU ---

// Hàm xử lý URL ảnh linh hoạt
function getImageUrl(url) {
    if (!url) return "{% static 'images/default.jpg' %}"; 
    if (url.startsWith('http') || url.startsWith('/media/') || url.startsWith('/static/')) return url;
    return '/static/images/' + url; // Mặc định nếu chỉ có tên file
}

// Khởi tạo bản đồ chính
function initMainMap() {
    mainMap = L.map('map').setView([10.776, 106.700], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(mainMap);
    
    mainMarker = L.marker([10.776, 106.700], {draggable: true}).addTo(mainMap);
    
    mainMap.on('click', e => {
        mainMarker.setLatLng(e.latlng);
        updateCoords('latitude', 'longitude', e.latlng);
    });
    mainMarker.on('dragend', () => updateCoords('latitude', 'longitude', mainMarker.getLatLng()));
}

// Cập nhật giá trị vào các ô input tọa độ
function updateCoords(latId, lngId, latlng) {
    document.getElementById(latId).value = latlng.lat.toFixed(6);
    document.getElementById(lngId).value = latlng.lng.toFixed(6);
}

// Tải dữ liệu từ API
async function loadPlaces(filter = null) {
    try {
        const res = await fetch("/api/admin/places/");
        allData = await res.json();
        
        // Lọc theo category nếu có
        filteredData = filter ? allData.filter(p => p.category === filter) : allData;
        
        currentPage = 1; 
        renderTable();
    } catch (error) {
        console.error("Lỗi khi tải dữ liệu:", error);
    }
}

// --- 2. HIỂN THỊ BẢNG & PHÂN TRANG ---

function renderTable() {
    const tbody = document.getElementById("placesTable");
    tbody.innerHTML = "";
    
    // Dọn dẹp marker cũ
    markers.forEach(m => mainMap.removeLayer(m));
    markers = [];

    // Chia trang
    const start = (currentPage - 1) * itemsPerPage;
    const end = start + itemsPerPage;
    const pageItems = filteredData.slice(start, end);

    pageItems.forEach(p => {
        const mainImg = getImageUrl(p.img);
        
        // Marker cho địa điểm trong trang hiện tại
        const m = L.marker([p.latitude, p.longitude]).addTo(mainMap)
                   .bindPopup(`<b>${p.name}</b><br><img src="${mainImg}" width="100">`);
        markers.push(m);

        const galleryHtml = (p.gallery || []).map(url => 
            `<img src="${getImageUrl(url)}" class="thumb">`
        ).join('');

        tbody.innerHTML += `
            <tr>
                <td><img src="${mainImg}" class="thumb" style="width:80px; height:60px;"></td>
                <td><div class="thumb-container">${galleryHtml}</div></td>
                <td>
                    <strong>${p.name}</strong><br>
                    <small class="badge">${p.category}</small><br>
                    <span class="price-tag">${new Intl.NumberFormat('vi-VN').format(p.price)}đ</span>
                </td>
                <td>
                    <button class="btn btn-edit" onclick="openEditModalById(${p.id})">✏️</button>
                    <button class="btn btn-delete" onclick="deletePlace(${p.id})">🗑️</button>
                </td>
            </tr>`;
    });

    renderPagination();
}

function renderPagination() {
    const paginationDiv = document.getElementById("pagination");
    if (!paginationDiv) return;
    
    paginationDiv.innerHTML = "";
    const totalPages = Math.ceil(filteredData.length / itemsPerPage);
    if (totalPages <= 1) return;

    // Helper tạo nút
    const createBtn = (content, isDisabled, onClickAction, isActive = false) => {
        const btn = document.createElement("button");
        btn.innerHTML = content;
        btn.className = `btn-page ${isActive ? 'active' : ''}`;
        btn.disabled = isDisabled;
        btn.onclick = onClickAction;
        return btn;
    };

    paginationDiv.appendChild(createBtn("«", currentPage === 1, () => { currentPage--; renderTable(); }));

    for (let i = 1; i <= totalPages; i++) {
        paginationDiv.appendChild(createBtn(i, false, () => { currentPage = i; renderTable(); }, i === currentPage));
    }

    paginationDiv.appendChild(createBtn("»", currentPage === totalPages, () => { currentPage++; renderTable(); }));
}

// --- 3. TÌM KIẾM & XỬ LÝ FORM ---

async function searchAddress(addrId, latId, lngId, mapInstance, markerInstanceName) {
    const address = document.getElementById(addrId).value;
    if (!address) return alert("Vui lòng nhập địa chỉ");

    try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`);
        const data = await res.json();
        if (data.length > 0) {
            const { lat, lon } = data[0];
            const newPos = [parseFloat(lat), parseFloat(lon)];

            mapInstance.setView(newPos, 15);
            if (markerInstanceName === 'mainMarker') mainMarker.setLatLng(newPos);
            else if (editMarker) editMarker.setLatLng(newPos);

            document.getElementById(latId).value = parseFloat(lat).toFixed(6);
            document.getElementById(lngId).value = parseFloat(lon).toFixed(6);
        } else alert("Không tìm thấy địa chỉ!");
    } catch (err) { console.error("Lỗi tìm kiếm:", err); }
}

function openEditModalById(id) {
    const p = allData.find(item => item.id === id);
    if (!p) return;

    ['editId', 'editName', 'editCategory', 'editLat', 'editLng', 'editPrice'].forEach(field => {
        document.getElementById(field).value = p[field.replace('edit', '').toLowerCase()] || '';
    });
    document.getElementById('editAddress').value = p.address || '';
    document.getElementById('editModal').style.display = 'flex';
    
    const pos = [p.latitude, p.longitude];
    if (!editMap) {
        editMap = L.map('editMap').setView(pos, 15);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(editMap);
        editMarker = L.marker(pos, {draggable: true}).addTo(editMap);
        editMarker.on('dragend', () => updateCoords('editLat', 'editLng', editMarker.getLatLng()));
    } else {
        editMap.setView(pos, 15);
        editMarker.setLatLng(pos);
    }
    setTimeout(() => editMap.invalidateSize(), 200);
}

// Thêm địa điểm
document.getElementById("addForm").onsubmit = async (e) => {
    e.preventDefault();
    const res = await fetch("/api/admin/places/", {
        method: "POST",
        body: new FormData(e.target),
        headers: { "X-CSRFToken": "{{ csrf_token }}" }
    });
    if (res.ok) { alert("Thêm thành công!"); e.target.reset(); loadPlaces(); }
};

// Cập nhật địa điểm
document.getElementById("editForm").onsubmit = async (e) => {
    e.preventDefault();
    const id = document.getElementById("editId").value;
    const res = await fetch(`/api/admin/places/${id}/`, {
        method: "POST",
        body: new FormData(e.target),
        headers: { "X-CSRFToken": "{{ csrf_token }}", "X-HTTP-Method-Override": "PUT" }
    });
    if (res.ok) { closeEditModal(); loadPlaces(); alert("Cập nhật thành công!"); }
};

async function deletePlace(id) {
    if (confirm("Bạn có chắc muốn xóa địa điểm này?")) {
        const res = await fetch(`/api/admin/places/${id}/`, { 
            method: "DELETE", headers: { "X-CSRFToken": "{{ csrf_token }}" } 
        });
        if (res.ok) loadPlaces();
    }
}

// --- 4. TIỆN ÍCH ---

function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }

function setupPreview(inputId, previewId) {
    document.getElementById(inputId).onchange = function(e) {
        const container = document.getElementById(previewId);
        container.innerHTML = '';
        if (e.target.files.length > 6) { alert("Tối đa 6 ảnh!"); e.target.value = ""; return; }
        
        Array.from(e.target.files).forEach(file => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = document.createElement('img');
                img.src = ev.target.result;
                img.className = 'preview-img';
                container.appendChild(img);
            }
            reader.readAsDataURL(file);
        });
    };
}

// Chạy hệ thống
setupPreview('image_files', 'image_preview');
setupPreview('edit_image_files', 'edit_image_preview');
window.onload = () => { initMainMap(); loadPlaces(); };
</script>
