{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin - Quản lý Địa điểm Du lịch</title>
    <link rel="stylesheet" href="{% static 'css/style_admin_places.css' %}">
</head>
<body>
<div class="container">
    <header>
        <h1>Quản lý Địa điểm Du lịch</h1>
    </header>

    <!-- Tabs phân loại -->
    <nav class="tabs">
        <button onclick="loadPlaces()">Tất cả</button>
        <button onclick="loadPlaces('Khu vui chơi')">Khu vui chơi</button>
        <button onclick="loadPlaces('Nhà hàng')">Nhà hàng</button>
        <button onclick="loadPlaces('Di tích')">Di tích</button>
        <button onclick="loadPlaces('Khách sạn')">Khách sạn</button>
    </nav>

    <!-- Form thêm mới -->
    <form id="addForm" class="form-card">
        <h2>Thêm địa điểm mới</h2>
        <div class="input-group">
            <input type="text" name="name" placeholder="Tên địa điểm" required>
            <input type="text" name="category" placeholder="Loại (VD: Nhà hàng)" required>
            <input type="text" name="address" placeholder="Địa chỉ">
        </div>
        <div class="input-group">
            <input type="number" step="any" name="latitude" placeholder="Vĩ độ" required>
            <input type="number" step="any" name="longitude" placeholder="Kinh độ" required>
            <input type="text" name="img" placeholder="Tên file ảnh">
        </div>
        <button type="submit" class="btn btn-add">➕ Thêm mới</button>
    </form>

    <!-- Bảng danh sách -->
    <section class="table-section">
        <h2>Danh sách địa điểm</h2>
        <table>
            <thead>
                <tr>
                    <th>Ảnh</th>
                    <th>Thông tin</th>
                    <th>Tọa độ</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="placesTable"></tbody>
        </table>
    </section>
</div>

<script>
function renderPlaces(data, categoryFilter=null) {
    const tbody = document.getElementById("placesTable");
    tbody.innerHTML = "";

    data.filter(p => {
        if (!categoryFilter) return true;
        return p.category && p.category.trim().toLowerCase() === categoryFilter.trim().toLowerCase();
    }).forEach(p => {
        tbody.innerHTML += `
            <tr>
                <td><img src="${p.img}" class="thumb" onerror="this.src='/static/images/default.jpg'"></td>
                <td>
                    <strong>${p.name}</strong><br>
                    <small>Loại: ${p.category} | ⭐ ${p.rating || 5.0}</small><br>
                    <small>Đ/C: ${p.address || 'N/A'}</small>
                </td>
                <td>${p.latitude}, ${p.longitude}</td>
                <td>
                    <button class="btn btn-edit" onclick="editPlace(${p.id}, '${p.name}', '${p.category}', '${p.address}', ${p.latitude}, ${p.longitude}, '${p.img || ''}')">✏️ Sửa</button>
                    <button class="btn btn-delete" onclick="deletePlace(${p.id})">🗑️ Xóa</button>
                </td>
            </tr>
        `;
    });
}

async function loadPlaces(categoryFilter=null) {
    const res = await fetch("/api/admin/places/");
    const data = await res.json();
    console.log("Categories từ API:", data.map(p => p.category));

    renderPlaces(data, categoryFilter);
}

document.getElementById("addForm").addEventListener("submit", async e => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const data = Object.fromEntries(formData.entries());
    data.latitude = parseFloat(data.latitude);
    data.longitude = parseFloat(data.longitude);

    const response = await fetch("/api/admin/places/", {
        method: "POST",
        headers: { 
            "Content-Type": "application/json",
            "X-CSRFToken": "{{ csrf_token }}" 
        },
        body: JSON.stringify(data)
    });

    if (response.ok) {
        e.target.reset();
        loadPlaces();
        alert("Thêm thành công!");
    } else {
        const errorData = await response.json();
        alert("Lỗi: " + errorData.error);
    }
});

async function deletePlace(id) {
    if (confirm("Bạn có muốn xóa địa điểm này?")) {
        const res = await fetch(`/api/admin/places/${id}/`, { 
            method: "DELETE",
            headers: { "X-CSRFToken": "{{ csrf_token }}" }
        });
        if (res.ok) loadPlaces();
    }
}

async function editPlace(id, oldName, oldCategory, oldAddress, oldLat, oldLng, oldImg) {
    const newName = prompt("Tên mới:", oldName);
    const newCategory = prompt("Loại mới:", oldCategory);
    const newAddress = prompt("Địa chỉ mới:", oldAddress);
    const newLat = parseFloat(prompt("Vĩ độ mới:", oldLat));
    const newLng = parseFloat(prompt("Kinh độ mới:", oldLng));
    const newImg = prompt("Tên file ảnh mới:", oldImg);

    if (!newName) return;

    await fetch(`/api/admin/places/${id}/`, {
        method: "PUT",
        headers: { 
            "Content-Type": "application/json",
            "X-CSRFToken": "{{ csrf_token }}"
        },
        body: JSON.stringify({
            name: newName,
            category: newCategory,   // ✅ sửa lại đúng field
            address: newAddress,
            latitude: newLat,
            longitude: newLng,
            img: newImg
        })
    });
    loadPlaces();
}

loadPlaces();
</script>
