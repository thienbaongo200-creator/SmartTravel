{% extends "base.html" %}
{% block title %}Thành công | Smart Travel{% endblock %}

{% block content %}
<div class="auth-container text-center">
    <div class="mb-4">
        <i class="fa fa-check-circle fa-3x" style="color: #2ecc71;"></i>
    </div>
    <h2>Thành công!</h2>
    <p class="text-muted small">Mật khẩu của bạn đã được thay đổi thành công. Bây giờ bạn có thể đăng nhập bằng mật khẩu mới.</p>
    
    <a href="{% url 'login' %}" class="btn" style="background: #4361ee; color: white; display: block; padding: 12px; border-radius: 12px; text-decoration: none; font-weight: 700; margin-top: 20px;">
        Đăng nhập ngay
    </a>
</div>
{% endblock %}
